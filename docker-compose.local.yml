name: vitaleevo-site-local

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: vitaleevo-site-postgres
    environment:
      POSTGRES_DB: vitaleevo
      POSTGRES_USER: vitaleevo
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - vitaleevo_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaleevo -d vitaleevo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    container_name: vitaleevo-site-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vitaleevo_redis8_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitaleevo-site-backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_ENV: development
      SECRET_KEY: local-docker-only-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://vitaleevo@postgres:5432/vitaleevo
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3015
      CSRF_TRUSTED_ORIGINS: http://localhost:3015
      SITE_URL: http://localhost:3015
      LOG_LEVEL: INFO
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8100 --workers 2 --timeout 60 --no-control-socket --access-logfile - --error-logfile -"
    ports:
      - "8100:8100"
    volumes:
      - vitaleevo_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health/ready/', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_SITE_URL: http://localhost:3015
    container_name: vitaleevo-site-frontend
    environment:
      INTERNAL_API_URL: http://backend:8100
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: http://localhost:3015
      SITE_URL: http://localhost:3015
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3015:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  vitaleevo_postgres18_data:
  vitaleevo_redis8_data:
  vitaleevo_media:
