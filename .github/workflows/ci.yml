name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Lint, Typecheck e Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Build de produção (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SITE_URL: https://vitaleevo.ao
          SITE_URL: https://vitaleevo.ao
        run: npm run build:app

  backend:
    name: Backend — Checks, Migrações e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar dependências
        run: python -m pip check

      - name: Django system check
        run: python manage.py check

      - name: Validar migrações
        run: python manage.py makemigrations --check --dry-run

      - name: Testes backend
        run: python -m pytest
