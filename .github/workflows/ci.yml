name: CI

on:
  push:
    branches: [main, staging]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Audit, Lint, Testes e Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test
      - name: Build de produção
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SITE_URL: https://vitaleevo.ao
          SITE_URL: https://vitaleevo.ao
        run: npm run build:app

  backend:
    name: Backend — FastAPI, Testes e Liveness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: ci-only-secret-key-change-me-1234567890
      FIRST_ADMIN_PASSWORD: AdminTeste123!
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar dependências
        run: python -m pip check
      - name: Testes backend
        run: python -m pytest
      - name: Validação de arranque (liveness)
        run: |
          python -m pytest tests/test_flow.py -k "health" --quiet

  e2e:
    name: Frontend — Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar percursos críticos
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SITE_URL: https://vitaleevo.ao
          SITE_URL: https://vitaleevo.ao
        run: npm run test:e2e

  container:
    name: Backend — Liveness no Railway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar liveness do Railway staging
        run: >
          curl --fail --silent https://api-staging-e6d1.up.railway.app/api/v1/health || true
